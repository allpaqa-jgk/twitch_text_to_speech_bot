name: Test & Build

on:
  push:
    branches:
      - master
    # PR updates are covered by pull_request; keep push CI for direct/default-branch pushes only.
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build
